<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vietcong-web — procedural prototype</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: monospace; color: #0f0; }
    canvas { display: block; }
    #info { position: absolute; top: 10px; left: 10px; pointer-events: none; text-shadow: 0 0 4px #000; }
    #menu { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,20,0,.82); z-index: 10; text-align: center; }
    #menu .card { border: 1px solid #0f0; padding: 28px 36px; background: #031003; max-width: 520px; }
    #menu h1 { margin: 0 0 4px; letter-spacing: 4px; }
    #menu p { color: #9f9; font-size: 12px; }
    #menu button { font-family: monospace; margin: 6px; padding: 10px 18px; cursor: pointer;
      background: #0f0; color: #000; border: 0; font-weight: bold; }
    #menu button.ghost { background: transparent; color: #0f0; border: 1px solid #0f0; }
  </style>
</head>
<body>
  <div id="info">loading…</div>
  <div id="menu"><div class="card">
    <h1>VIETCONG-WEB</h1>
    <p>Non-commercial fan prototype. All art + music procedural.<br>No original Vietcong assets included.</p>
    <p id="audio-note">♪ original menu theme (WebAudio, generated)</p>
    <button id="btn-deploy">DEPLOY — SINGLEPLAYER</button><br>
    <button id="btn-net" class="ghost">MULTIPLAYER (STUB)</button>
    <button id="btn-mute" class="ghost">MUTE: OFF</button>
  </div></div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
